<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WebGPU Responsive Line (100px)</title>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #111; }
      canvas { display: block; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <!-- Canvas тепер займає 100% ширини та висоти екрана -->
    <canvas id="gpuCanvas"></canvas>

    <script type="module">
      if (!navigator.gpu) throw new Error("WebGPU not supported.");

      const canvas = document.getElementById("gpuCanvas");
      const adapter = await navigator.gpu.requestAdapter();
      const device = await adapter.requestDevice();

      const context = canvas.getContext("webgpu");
      const canvasFormat = navigator.gpu.getPreferredCanvasFormat();

      // 1. ШЕЙДЕР, ЯКИЙ ПРИЙМАЄ РОЗМІРИ ЧЕРЕЗ UNIFORM
      const shaderCode = `
        // Описуємо структуру даних, яку ми передамо з JavaScript
        struct CanvasSize {
            width: f32,
            height: f32,
        };

        // Зв'язуємо структуру з буфером (group 0, binding 0)
        @group(0) @binding(0) var<uniform> canvasSize : CanvasSize;

        struct VertexOutput {
            @builtin(position) position : vec4<f32>,
            @location(0) color : vec3<f32>,
        };

        @vertex
        fn vs_main(@builtin(vertex_index) vertexIndex : u32) -> VertexOutput {
            // Знаходимо центр екрана динамічно на основі отриманих даних
            let startX: f32 = canvasSize.width / 2.0;
            let startY: f32 = canvasSize.height / 2.0;
            
            const lineLength: f32 = 100.0; // Фіксована довжина лінії

            var pixelPos = array<vec2<f32>, 2>(
                vec2<f32>(startX, startY),
                vec2<f32>(startX + lineLength, startY)
            );

            // Використовуємо динамічні розміри з Uniform-буфера для переведення в NDC
            var ndcX = (pixelPos[vertexIndex].x / canvasSize.width) * 2.0 - 1.0;
            var ndcY = -((pixelPos[vertexIndex].y / canvasSize.height) * 2.0 - 1.0);

            var output : VertexOutput;
            output.position = vec4<f32>(ndcX, ndcY, 0.0, 1.0);
            output.color = vec3<f32>(1.0, 0.5, 0.0); // Помаранчева лінія
            return output;
        }

        @fragment
        fn fs_main(@location(0) color : vec3<f32>) -> @location(0) vec4<f32> {
            return vec4<f32>(color, 1.0);
        }
      `;

      const shaderModule = device.createShaderModule({ code: shaderCode });

      // 2. СТВОРЮЄМО UNIFORM БУФЕР НА ВІДЕОКАРТІ (Розмір: 2 числа типу f32 = 8 байт)
      const uniformBuffer = device.createBuffer({
        size: 8, 
        usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST,
      });

      // Створюємо масив у JavaScript, через який будемо передавати дані
      const uniformData = new Float32Array(2); 

      const pipeline = device.createRenderPipeline({
        layout: 'auto',
        vertex: { module: shaderModule, entryPoint: 'vs_main' },
        fragment: { module: shaderModule, entryPoint: 'fs_main', targets: [{ format: canvasFormat }] },
        primitive: { topology: 'line-list' },
      });

      // Створюємо BindGroup, щоб зв'язати наш буфер із шейдером
      const bindGroup = device.createBindGroup({
        layout: pipeline.getBindGroupLayout(0),
        entries: [{ binding: 0, resource: { buffer: uniformBuffer } }],
      });

      // 3. ГОЛОВНА ФУНКЦІЯ РЕНДЕРУ ТА ОНОВЛЕННЯ РОЗМІРІВ
      function render() {
        // Отримуємо реальні фізичні розміри вікна з урахуванням Retina-дисплея Mac (devicePixelRatio)
        const dpr = window.devicePixelRatio || 1;
        const displayWidth = Math.floor(canvas.clientWidth * dpr);
        const displayHeight = Math.floor(canvas.clientHeight * dpr);

        // Якщо розмір змінився, підлаштовуємо Canvas під нові пікселі
        if (canvas.width !== displayWidth || canvas.height !== displayHeight) {
          canvas.width = displayWidth;
          canvas.height = displayHeight;
          
          context.configure({
            device: device,
            format: canvasFormat,
            alphaMode: "opaque"
          });
        }

        // Записуємо нові розміри в наш масив JavaScript
        uniformData[0] = canvas.width;
        uniformData[1] = canvas.height;

        // Завантажуємо оновлені розміри прямо в пам'ять відеокарти (Uniform Buffer)
        device.queue.writeBuffer(uniformBuffer, 0, uniformData.buffer);

        // Стандартний командний запис рендер-пассу
        const commandEncoder = device.createCommandEncoder();
        const renderPassEncoder = commandEncoder.beginRenderPass({
          colorAttachments: [{
            view: context.getCurrentTexture().createView(),
            clearValue: { r: 0.1, g: 0.1, b: 0.1, a: 1.0 },
            loadOp: 'clear',
            storeOp: 'store',
          }],
        });

        renderPassEncoder.setPipeline(pipeline);
        renderPassEncoder.setBindGroup(0, bindGroup); // Передаємо BindGroup в конвеєр перед малюванням
        renderPassEncoder.draw(2); 
        renderPassEncoder.end();
        
        device.queue.submit([commandEncoder.finish()]);
      }

      // 4. СЛУХАЄМО ПОДІЮ ЗМІНИ РОЗМІРУ ВІКНА
      window.addEventListener("resize", () => {
        // Перерендерюємо сцену за запитом браузера
        requestAnimationFrame(render);
      });

      // Перший запуск при завантаженні сторінки
      render();
    </script>
  </body>
</html>
