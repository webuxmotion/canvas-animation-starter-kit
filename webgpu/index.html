<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WebGPU Thick Line (10px)</title>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #111; }
      canvas { display: block; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <canvas id="gpuCanvas"></canvas>

    <script type="module">
      if (!navigator.gpu) throw new Error("WebGPU not supported.");

      const canvas = document.getElementById("gpuCanvas");
      const adapter = await navigator.gpu.requestAdapter();
      const device = await adapter.requestDevice();

      const context = canvas.getContext("webgpu");
      const canvasFormat = navigator.gpu.getPreferredCanvasFormat();

      // 1. ШЕЙДЕР, ЯКИЙ БУДУЄ ПРЯМОКУТНИК НАВКОЛО ЛІНІЇ
      const shaderCode = `
        struct CanvasSize {
            width: f32,
            height: f32,
        };

        @group(0) @binding(0) var<uniform> canvasSize : CanvasSize;

        struct VertexOutput {
            @builtin(position) position : vec4<f32>,
            @location(0) color : vec3<f32>,
        };

        @vertex
        fn vs_main(@builtin(vertex_index) vertexIndex : u32) -> VertexOutput {
            // Центр екрана в пікселях
            let startX: f32 = canvasSize.width / 2.0;
            let startY: f32 = canvasSize.height / 2.0;
            
            const lineLength: f32 = 200.0; // Довжина лінії в пікселях
            const thickness: f32 = 10.0;   // Товщина лінії в пікселях
            const halfThick: f32 = thickness / 2.0;

            // Будуємо 4 кути прямокутника (в пікселях) навколо центральної осі лінії
            // Лінія йде зліва направо від (startX) до (startX + lineLength)
            var vertices = array<vec2<f32>, 4>(
                vec2<f32>(startX, startY - halfThick),              // 0. Верхній лівий
                vec2<f32>(startX + lineLength, startY - halfThick),   // 1. Верхній правий
                vec2<f32>(startX, startY + halfThick),              // 2. Нижній лівий
                vec2<f32>(startX + lineLength, startY + halfThick)    // 3. Нижній правий
            );

            // Індексна карта для збирання прямокутника з 2-х трикутників (всього 6 вершин)
            // Перший трикутник: 0 -> 1 -> 2
            // Другий трикутник: 2 -> 1 -> 3
            var indices = array<u32, 6>(0, 1, 2, 2, 1, 3);
            let currentVertex = vertices[indices[vertexIndex]];

            // Переведення координат пікселів у відносні NDC (-1.0 до 1.0)
            let ndcX = (currentVertex.x / canvasSize.width) * 2.0 - 1.0;
            let ndcY = -((currentVertex.y / canvasSize.height) * 2.0 - 1.0);

            var output : VertexOutput;
            output.position = vec4<f32>(ndcX, ndcY, 0.0, 1.0);
            output.color = vec3<f32>(0.0, 0.8, 1.0); // Яскравий блакитний колір
            return output;
        }

        @fragment
        fn fs_main(@location(0) color : vec3<f32>) -> @location(0) vec4<f32> {
            return vec4<f32>(color, 1.0);
        }
      `;

      const shaderModule = device.createShaderModule({ code: shaderCode });

      const uniformBuffer = device.createBuffer({
        size: 8, 
        usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST,
      });

      const uniformData = new Float32Array(2); 

      const pipeline = device.createRenderPipeline({
        layout: 'auto',
        vertex: { module: shaderModule, entryPoint: 'vs_main' },
        fragment: { module: shaderModule, entryPoint: 'fs_main', targets: [{ format: canvasFormat }] },
        primitive: { 
          // КРИТИЧНО: Міняємо 'line-list' на 'triangle-list'
          topology: 'triangle-list' 
        },
      });

      const bindGroup = device.createBindGroup({
        layout: pipeline.getBindGroupLayout(0),
        entries: [{ binding: 0, resource: { buffer: uniformBuffer } }],
      });

      function render() {
        const dpr = window.devicePixelRatio || 1;
        const displayWidth = Math.floor(canvas.clientWidth * dpr);
        const displayHeight = Math.floor(canvas.clientHeight * dpr);

        if (canvas.width !== displayWidth || canvas.height !== displayHeight) {
          canvas.width = displayWidth;
          canvas.height = displayHeight;
          context.configure({ device: device, format: canvasFormat, alphaMode: "opaque" });
        }

        uniformData[0] = canvas.width;
        uniformData[1] = canvas.height;
        device.queue.writeBuffer(uniformBuffer, 0, uniformData.buffer);

        const commandEncoder = device.createCommandEncoder();
        const renderPassEncoder = commandEncoder.beginRenderPass({
          colorAttachments: [{
            view: context.getCurrentTexture().createView(),
            clearValue: { r: 0.1, g: 0.1, b: 0.1, a: 1.0 },
            loadOp: 'clear',
            storeOp: 'store',
          }],
        });

        renderPassEncoder.setPipeline(pipeline);
        renderPassEncoder.setBindGroup(0, bindGroup);
        
        // Малюємо 6 вершин (два трикутники, які утворюють прямокутник товщиною 10px)
        renderPassEncoder.draw(6); 
        
        renderPassEncoder.end();
        device.queue.submit([commandEncoder.finish()]);
      }

      window.addEventListener("resize", () => { requestAnimationFrame(render); });
      render();
    </script>
  </body>
</html>
