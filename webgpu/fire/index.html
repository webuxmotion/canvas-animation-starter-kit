<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WebGPU 200,000 Particles Fire Effect</title>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #020204; }
      canvas { display: block; width: 100%; height: 100%; }
      #info { position: absolute; top: 20px; left: 20px; color: #ff5500; font-family: monospace; font-size: 16px; background: rgba(0,0,0,0.85); padding: 15px; border-radius: 8px; border: 1px solid #331100; pointer-events: none; z-index: 10; line-height: 1.5; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
      .highlight { color: #fff; font-weight: bold; }
    </style>
  </head>
  <body>
    <div id="info">
      Ефект: <span class="highlight">Еволюція вогню (Система частинок)</span><br>
      Активних іскор: <span class="highlight" id="particles-val">0</span><br>
      Продуктивність: <span class="highlight" id="fps-val">0</span> FPS<br>
      Обчислення: <span style="color: #ffaa00; font-weight: bold;">Compute Shader (100% GPU M3 Pro)</span>
    </div>
    <canvas id="gpuCanvas"></canvas>
    <script type="module" src="./main.js"></script>
  </body>
</html>
