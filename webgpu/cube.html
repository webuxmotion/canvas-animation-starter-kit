<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WebGPU 3D Cube Animation</title>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #0d0e12; }
      canvas { display: block; width: 100%; height: 100%; }
      #info { position: absolute; top: 20px; left: 20px; color: #00ffff; font-family: monospace; font-size: 16px; background: rgba(0,0,0,0.8); padding: 12px; border-radius: 6px; pointer-events: none; border: 1px solid #222; z-index: 10; }
    </style>
  </head>
  <body>
    <div id="info">3D Куб на WebGPU<br>Статус: Робота через чисту матрицю 4x4</div>
    <canvas id="gpuCanvas"></canvas>

    <script type="module">
      if (!navigator.gpu) throw new Error("WebGPU not supported.");

      const canvas = document.getElementById("gpuCanvas");
      const adapter = await navigator.gpu.requestAdapter();
      const device = await adapter.requestDevice();

      const context = canvas.getContext("webgpu");
      const canvasFormat = navigator.gpu.getPreferredCanvasFormat();

      // 1. ВЕРТЕМНИЙ ТА ФРАГМЕНТНИЙ ШЕЙДЕР (WGSL)
      const shaderCode = `
        struct Uniforms {
            mvpMatrix: mat4x4<f32>,
        };

        @group(0) @binding(0) var<uniform> uniforms : Uniforms;

        struct VertexInput {
            @location(0) position: vec3<f32>,
            @location(1) color: vec3<f32>,
        };

        struct VertexOutput {
            @builtin(position) position: vec4<f32>,
            @location(0) color: vec3<f32>,
        };

        @vertex
        fn vs_main(input: VertexInput) -> VertexOutput {
            var output: VertexOutput;
            output.position = uniforms.mvpMatrix * vec4<f32>(input.position, 1.0);
            output.color = input.color;
            return output;
        }

        @fragment
        fn fs_main(@location(0) color: vec3<f32>) -> @location(0) vec4<f32> {
            return vec4<f32>(color, 1.0);
        }
      `;

      // 2. ВЕРШИНИ ТА КОЛЬОРИ КУБА (Кожна грань має свій колір)
      const vertexData = new Float32Array([
        // Позиція (X, Y, Z)     Колір (R, G, B)
        -0.5, -0.5,  0.5,     1.0, 0.0, 0.0, // Передня грань (Червона)
         0.5, -0.5,  0.5,     1.0, 0.0, 0.0,
         0.5,  0.5,  0.5,     1.0, 0.0, 0.0,
        -0.5,  0.5,  0.5,     1.0, 0.0, 0.0,

        -0.5, -0.5, -0.5,     0.0, 1.0, 0.0, // Задня грань (Зелена)
        -0.5,  0.5, -0.5,     0.0, 1.0, 0.0,
         0.5,  0.5, -0.5,     0.0, 1.0, 0.0,
         0.5, -0.5, -0.5,     0.0, 1.0, 0.0,

        -0.5,  0.5, -0.5,     0.0, 0.0, 1.0, // Верхня грань (Синя)
        -0.5,  0.5,  0.5,     0.0, 0.0, 1.0,
         0.5,  0.5,  0.5,     0.0, 0.0, 1.0,
         0.5,  0.5, -0.5,     0.0, 0.0, 1.0,

        -0.5, -0.5, -0.5,     1.0, 1.0, 0.0, // Нижня грань (Жовта)
         0.5, -0.5, -0.5,     1.0, 1.0, 0.0,
         0.5, -0.5,  0.5,     1.0, 1.0, 0.0,
        -0.5, -0.5,  0.5,     1.0, 1.0, 0.0,

         0.5, -0.5, -0.5,     0.0, 1.0, 1.0, // Права грань (Блакитна)
         0.5,  0.5, -0.5,     0.0, 1.0, 1.0,
         0.5,  0.5,  0.5,     0.0, 1.0, 1.0,
         0.5, -0.5,  0.5,     0.0, 1.0, 1.0,

        -0.5, -0.5, -0.5,     1.0, 0.0, 1.0, // Ліва грань (Фіолетова)
        -0.5, -0.5,  0.5,     1.0, 0.0, 1.0,
        -0.5,  0.5,  0.5,     1.0, 0.0, 1.0,
        -0.5,  0.5, -0.5,     1.0, 0.0, 1.0,
      ]);

      const indexData = new Uint16Array([
         0,  1,  2,   0,  2,  3, // Передня грань
         4,  5,  6,   4,  6,  7, // Задня грань
         8,  9, 10,   8, 10, 11, // Верхня грань
        12, 13, 14,  12, 14, 15, // Нижня грань
        16, 17, 18,  16, 18, 19, // Права грань
        20, 21, 22,  20, 22, 23, // Ліва грань
      ]);

      // Створення буферів у пам'яті GPU
      const vertexBuffer = device.createBuffer({ size: vertexData.byteLength, usage: GPUBufferUsage.VERTEX, mappedAtCreation: true });
      new Float32Array(vertexBuffer.getMappedRange()).set(vertexData); vertexBuffer.unmap();

      const indexBuffer = device.createBuffer({ size: indexData.byteLength, usage: GPUBufferUsage.INDEX, mappedAtCreation: true });
      new Uint16Array(indexBuffer.getMappedRange()).set(indexData); indexBuffer.unmap();

      const uniformBuffer = device.createBuffer({ size: 64, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST });

      const shaderModule = device.createShaderModule({ code: shaderCode });
      const depthTextureFormat = "depth24plus";

      const pipeline = device.createRenderPipeline({
        layout: "auto",
        vertex: {
          module: shaderModule,
          entryPoint: "vs_main",
          buffers: [{
            arrayStride: 24,
            attributes: [
              { shaderLocation: 0, offset: 0, format: "float32x3" },
              { shaderLocation: 1, offset: 12, format: "float32x3" }
            ]
          }]
        },
        fragment: { module: shaderModule, entryPoint: "fs_main", targets: [{ format: canvasFormat }] },
        primitive: { topology: "triangle-list", cullMode: "back" },
        depthStencil: { depthWriteEnabled: true, depthCompare: "less", format: depthTextureFormat }
      });

      const bindGroup = device.createBindGroup({
        layout: pipeline.getBindGroupLayout(0),
        entries: [{ binding: 0, resource: { buffer: uniformBuffer } }]
      });

      let depthTexture = null;

      // 3. ЛІНІЙНА АЛГЕБРА 4x4 (ПРОЕКЦІЯ ТА ОБЕРТАННЯ)
      function getMVPMatrix(width, height, time) {
        const aspect = width / height;
        
        // Матриця перспективи (Perspective Projection)
        const fov = 60 * Math.PI / 180;
        const f = 1.0 / Math.tan(fov / 2);
        const near = 0.1, far = 10.0;
        
        const proj = new Float32Array(16);
        proj[0] = f / aspect;
        proj[5] = f;
        proj[10] = far / (near - far);
        proj[11] = -1.0;
        proj[14] = (far * near) / (near - far);

        // Обчислення кутів обертання від часу
        const angleX = time * 0.001;
        const angleY = time * 0.0012;
        
        const cx = Math.cos(angleX), sx = Math.sin(angleX);
        const cy = Math.cos(angleY), sy = Math.sin(angleY);

        // Комбінована матриця моделі та вигляду (Model-View)
        // Віддаляємо куб від камери на -2.0 по осі Z
        const mv = new Float32Array(16);
        mv[0] = cy;          mv[1] = sy * sx;        mv[2] = -sy * cx;       mv[3] = 0;
        mv[4] = 0;           mv[5] = cx;             mv[6] = sx;             mv[7] = 0;
        mv[8] = sy;          mv[9] = -cy * sx;       mv[10] = cy * cx;       mv[11] = 0;
        mv[12] = 0;          mv[13] = 0;             mv[14] = -2.0;          mv[15] = 1;

        // Перемножуємо матриці: Projection * ModelView
        const mvp = new Float32Array(16);
        for (let r = 0; r < 4; r++) {
          for (let c = 0; c < 4; c++) {
            let sum = 0;
            for (let k = 0; k < 4; k++) {
              sum += proj[r + k * 4] * mv[k + c * 4];
            }
            mvp[r + c * 4] = sum;
          }
        }
        return mvp;
      }

      // 4. ЦИКЛ АНІМАЦІЇ ТА ОНОВЛЕННЯ КАДРІВ
      function render(timestamp) {
        const dpr = window.devicePixelRatio || 1;
        const targetWidth = Math.floor(canvas.clientWidth * dpr);
        const targetHeight = Math.floor(canvas.clientHeight * dpr);

        if (canvas.width !== targetWidth || canvas.height !== targetHeight) {
          canvas.width = targetWidth;
          canvas.height = targetHeight;
          
          context.configure({ device: device, format: canvasFormat, alphaMode: "opaque" });
          
          // Оновлюємо Z-буфер під нову роздільну здатність екрана
          if (depthTexture) depthTexture.destroy();
          depthTexture = device.createTexture({
            size: [canvas.width, canvas.height],
            format: depthTextureFormat,
            usage: GPUTextureUsage.RENDER_ATTACHMENT
          });
        }

        // Отримуємо нову матрицю трансформації для поточного кадру
        const mvp = getMVPMatrix(canvas.width, canvas.height, timestamp);
        device.queue.writeBuffer(uniformBuffer, 0, mvp.buffer);

        const commandEncoder = device.createCommandEncoder();
        const renderPassEncoder = commandEncoder.beginRenderPass({
          colorAttachments: [{
            view: context.getCurrentTexture().createView(),
            clearValue: { r: 0.08, g: 0.09, b: 0.12, a: 1.0 },
            loadOp: "clear",
            storeOp: "store"
          }],
          // Підключаємо текстуру глибини
          depthStencilAttachment: {
            view: depthTexture.createView(),
            depthClearValue: 1.0,
            depthLoadOp: "clear",
            depthStoreOp: "store"
          }
        });

        renderPassEncoder.setPipeline(pipeline);
        renderPassEncoder.setBindGroup(0, bindGroup);
        renderPassEncoder.setVertexBuffer(0, vertexBuffer);
        renderPassEncoder.setIndexBuffer(indexBuffer, "uint16");
        
        // Малюємо 36 вершин куба по індексах
        renderPassEncoder.drawIndexed(36);
        
        renderPassEncoder.end();
        device.queue.submit([commandEncoder.finish()]);

        requestAnimationFrame(render);
      }

      requestAnimationFrame(render);
    </script>
  </body>
</html>
