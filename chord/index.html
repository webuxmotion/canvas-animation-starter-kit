<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>01-easing-1.html</title>
    <style>
      body { margin: 0; }
      canvas { border: 1px solid; }
    </style>
  </head>
  <body>
    <canvas id="canvas" width="500" height="500"></canvas>

    <script type="module">
      const canvas = document.getElementById("canvas");
      const ctx = canvas.getContext("2d");

      const circle = {
        x: canvas.width / 2,
        y: canvas.height / 2,
        radius: 100,
        sides: 30,
      };

      let angle = 0;

      // Параметри руху (тепер ведемо точку по ДОВШІЙ хорді)
      let progress = 0;      
      let direction = 1;     
      const speed = 0.005;   

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        drawCircle();

        // Оновлюємо прогрес для ведучої точки
        progress += speed * direction;
        if (progress >= 1 || progress <= 0) {
          direction *= -1; 
        }

        // Задаємо відстань хорд від центра кола
        const height1 = circle.radius * 0.6; // Коротша хорда
        const height2 = circle.radius * 0.1; // Довша хорда

        // 1. Малюємо дві паралельні хорди (обидві без вбудованих точок, t = null)
        const chord1 = drawChord(height1, angle, null, "transparent");
        const chord2 = drawChord(height2, angle, null, "transparent");

        // 2. Розраховуємо позицію ведучої (синьої) точки на ДОВШІЙ хорді (chord2)
        const chordLen2 = Math.hypot(chord2.x2 - chord2.x1, chord2.y2 - chord2.y1);
        const halfChord2 = chordLen2 / 2;
        const startX2 = halfChord2 - 3;
        const endX2 = -halfChord2 + 3;
        const xLen2 = startX2 + (endX2 - startX2) * progress;

        const localAngle2 = Math.atan2(xLen2, height2);
        const pointHypot2 = Math.hypot(height2, xLen2);
        const finalAngle3_blue = angle + Math.PI / 2 + localAngle2;

        const blueX = circle.x + Math.cos(finalAngle3_blue) * pointHypot2;
        const blueY = circle.y + Math.sin(finalAngle3_blue) * pointHypot2;

        // Малюємо ведучу синю точку
        ctx.beginPath(); ctx.arc(blueX, blueY, 4, 0, Math.PI * 2); ctx.fillStyle = "blue"; ctx.fill();

        // --- ВЕКТОРНИЙ РОЗРАХУНОК ПЕРПЕНДИКУЛЯРА ВІД СИНЬОЇ ТОЧКИ ---
        const v2x = chord2.x2 - chord2.x1;
        const v2y = chord2.y2 - chord2.y1;

        // Базовий перпендикуляр від довшої хорди
        let px = -v2y;
        let py = v2x;

        // Напрямок до центру коротшої хорди
        const mid1x = (chord1.x1 + chord1.x2) / 2;
        const mid1y = (chord1.y1 + chord1.y2) / 2;

        // Коригуємо напрямок променя, щоб він завжди дивився на коротшу хорду
        if ((mid1x - blueX) * px + (mid1y - blueY) * py < 0) {
          px = -px;
          py = -py;
        }

        // Нормалізація вектора перпендикуляра
        const pLen = Math.hypot(px, py);
        const npx = px / pLen;
        const npy = py / pLen;

        // Вектор коротшої хорди
        const v1x = chord1.x2 - chord1.x1;
        const v1y = chord1.y2 - chord1.y1;

        // Перетин променя з лінією коротшої хорди (метод Крамера)
        const denom = v1x * npy - v1y * npx;
        
        let redX = blueX;
        let redY = blueY;
        let isOnChord1 = false;

        if (Math.abs(denom) > 0.0001) {
          const u = ((blueX - chord1.x1) * npy - (blueY - chord1.y1) * npx) / denom;

          // Якщо перпендикуляр потрапляє в межі коротшої хорди
          if (u >= 0 && u <= 1) {
            redX = chord1.x1 + v1x * u;
            redY = chord1.y1 + v1y * u;
            isOnChord1 = true;
          }
        }

        // Якщо коротша хорда закінчилася — промінь летить ТОЧНО на дугу кола
        if (!isOnChord1) {
          const ocx = blueX - circle.x;
          const ocy = blueY - circle.y;

          const b = 2 * (ocx * npx + ocy * npy);
          const c = ocx * ocx + ocy * ocy - circle.radius * circle.radius;

          const discriminant = b * b - 4 * c;

          if (discriminant >= 0) {
            const t1 = (-b + Math.sqrt(discriminant)) / 2;
            const t2 = (-b - Math.sqrt(discriminant)) / 2;
            const tFinal = Math.max(t1, t2);

            redX = blueX + npx * tFinal;
            redY = blueY + npy * tFinal;
          }
        }

        // Малюємо ведену червону точку
        ctx.beginPath(); ctx.arc(redX, redY, 4, 0, Math.PI * 2); ctx.fillStyle = "red"; ctx.fill();

        // 3. Малюємо зелену лінію зв'язку (ідеальний кут 90° до обох хорд!)
        ctx.beginPath();
        ctx.moveTo(blueX, blueY);
        ctx.lineTo(redX, redY);
        ctx.strokeStyle = "green";
        ctx.lineWidth = 1.5;
        ctx.stroke();
        ctx.lineWidth = 1;

        angle += 0.001; // Повільне обертання

        requestAnimationFrame(draw);
      }

      function drawCircle() {
        const angleStep = (Math.PI * 2) / circle.sides;
        ctx.beginPath();
        for (let i = 0; i <= circle.sides; i++) {
          const x = Math.cos(i * angleStep) * circle.radius + circle.x;
          const y = Math.sin(i * angleStep) * circle.radius + circle.y;
          if (i == 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.strokeStyle = "black";
        ctx.stroke();
      }

      function drawChord(height, angle = 0, t = null, pointColor = "red") {
        const baseAngle1 = Math.asin(height / circle.radius);
        const baseAngle2 = Math.PI - baseAngle1;

        const finalAngle1 = baseAngle1 + angle;
        const finalAngle2 = baseAngle2 + angle;

        const x1 = circle.x + Math.cos(finalAngle1) * circle.radius;
        const y1 = circle.y + Math.sin(finalAngle1) * circle.radius;

        const x2 = circle.x + Math.cos(finalAngle2) * circle.radius;
        const y2 = circle.y + Math.sin(finalAngle2) * circle.radius;

        ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.strokeStyle = "#ccc"; ctx.stroke();
        ctx.beginPath(); ctx.arc(x1, y1, 4, 0, Math.PI * 2); ctx.fillStyle = "black"; ctx.fill();
        ctx.beginPath(); ctx.arc(x2, y2, 4, 0, Math.PI * 2); ctx.fill();

        return { x1, y1, x2, y2 };
      }

      requestAnimationFrame(draw);
    </script>
  </body>
</html>
