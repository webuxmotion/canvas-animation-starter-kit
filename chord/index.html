<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>01-easing-1.html</title>
    <style>
      body {
        margin: 0;
      }
      canvas {
        border: 1px solid;
      }
    </style>
  </head>
  <body>
    <canvas id="canvas" width="500" height="500"></canvas>

    <script type="module">
      const canvas = document.getElementById("canvas");
      const ctx = canvas.getContext("2d");

      const circle = {
        x: canvas.width / 2,
        y: canvas.height / 2,
        radius: 100,
        sides: 30,
      };

      let angle = 0;

      // Параметри лінійного руху
      let progress = 0; // Чистий прогрес від 0 до 1
      let direction = 1; // 1 — вперед до x2, -1 — назад до x1
      const speed = 0.005; // Фіксована швидкість руху точки

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        drawCircle();

        // Лінійно змінюємо прогрес (крок однаковий на кожному кадрі)
        progress += speed * direction;

        // Реверс руху при досягненні країв
        if (progress >= 1) {
          progress = 1;
          direction = -1;
        } else if (progress <= 0) {
          progress = 0;
          direction = 1;
        }

        // Передаємо чистий лінійний прогрес
        drawChord(circle.radius / 2, angle, progress);

        angle += 0.001;

        requestAnimationFrame(draw);
      }

      function drawCircle() {
        const angleStep = (Math.PI * 2) / circle.sides;
        ctx.beginPath();
        for (let i = 0; i <= circle.sides; i++) {
          const x = Math.cos(i * angleStep) * circle.radius + circle.x;
          const y = Math.sin(i * angleStep) * circle.radius + circle.y;
          if (i == 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.stroke();
      }

      function drawChord(height, angle = 0, t = 0) {
        const baseAngle1 = Math.asin(height / circle.radius);
        const baseAngle2 = Math.PI - baseAngle1;

        const finalAngle1 = baseAngle1 + angle;
        const finalAngle2 = baseAngle2 + angle;

        const x1 = circle.x + Math.cos(finalAngle1) * circle.radius;
        const y1 = circle.y + Math.sin(finalAngle1) * circle.radius;

        const x2 = circle.x + Math.cos(finalAngle2) * circle.radius;
        const y2 = circle.y + Math.sin(finalAngle2) * circle.radius;

        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(x1, y1, 4, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(x2, y2, 4, 0, Math.PI * 2);
        ctx.fill();

        // --- ВАШ МЕТОД З ЛІНІЙНИМ ПАРАМЕТРОМ xLen ---
        const chordLen = Math.hypot(x1 - x2, y1 - y2);
        const halfChord = chordLen / 2;

        // Точка йде строго рівномірно від (halfChord - 3) до (-halfChord + 3)
        const startX = halfChord - 3;
        const endX = -halfChord + 3;
        const xLen = startX + (endX - startX) * t;

        // Ваша математика
        const localAngle = Math.atan2(xLen, height);
        const pointHypot = Math.hypot(height, xLen);
        const finalAngle3 = angle + Math.PI / 2 + localAngle;

        const x3 = circle.x + Math.cos(finalAngle3) * pointHypot;
        const y3 = circle.y + Math.sin(finalAngle3) * pointHypot;

        ctx.beginPath();
        ctx.arc(x3, y3, 4, 0, Math.PI * 2);
        ctx.fillStyle = "red";
        ctx.fill();
        ctx.fillStyle = "black";
      }

      requestAnimationFrame(draw);
    </script>
  </body>
</html>
