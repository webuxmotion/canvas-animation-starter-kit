<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      canvas {
        border: 1px solid blue;
      }
    </style>
  </head>
  <body>
    <canvas id="canvas" width="500" height="500"></canvas>

    <script type="module">
      import getHorizontalScanIntersection from "./getHorizontalScanIntersection.js";

      const canvas = document.getElementById("canvas");
      const ctx = canvas.getContext("2d");

      const A = { x: 200, y: 20 };
      const B = { x: 20,  y: 300 };
      const C = { x: 20,  y: 150 };

      const triangle = [A, B, C];

      // Малюємо контур трикутника
      ctx.save();
      ctx.beginPath();
      for (let i = 0; i < triangle.length; i++) {
        if (i == 0) {
          ctx.moveTo(triangle[i].x, triangle[i].y);
        } else {
          ctx.lineTo(triangle[i].x, triangle[i].y);
        }
      }
      ctx.lineTo(triangle[0].x, triangle[0].y);
      ctx.stroke();
      ctx.restore();

      // Алгоритм заповнення (Scanline Fill)
      for (let i = 0; i < canvas.height; i++) {
        const rawPointsX = [];

        triangle.forEach((p, idx) => {
          const nextPoint = triangle[(idx === triangle.length - 1) ? 0 : idx + 1];
          const intersectionPoint = getHorizontalScanIntersection(p, nextPoint, i);

          if (intersectionPoint && intersectionPoint.x >= 0) {
            // Округляємо до цілих пікселів, щоб Set міг чітко відсіяти дублікати на вершинах
            rawPointsX.push(Math.round(intersectionPoint.x));
          }
        });

        // 1. ВИПРАВЛЕННЯ: Фільтруємо дублікати (на вершинах Set залишить лише одну унікальну координату X)
        const uniquePointsX = [...new Set(rawPointsX)];

        // 2. ВИПРАВЛЕННЯ: Сортуємо координати зліва направо
        uniquePointsX.sort((a, b) => a - b);

        // 3. ВИПРАВЛЕННЯ: Малюємо залежно від кількості знайдених унікальних точок
        if (uniquePointsX.length === 2) {
          // Звичайна горизонтальна лінія заливки
          ctx.save();
          ctx.beginPath();
          ctx.moveTo(uniquePointsX[0], i);
          ctx.lineTo(uniquePointsX[1], i);
          ctx.stroke();
          ctx.restore();
        } else if (uniquePointsX.length === 1) {
          // Лінія пройшла точно через вершину — малюємо один піксель (лінія довжиною 1px)
          ctx.save();
          ctx.beginPath();
          ctx.moveTo(uniquePointsX[0], i);
          ctx.lineTo(uniquePointsX[0] + 1, i);
          ctx.stroke();
          ctx.restore();
        }
      }
    </script>
  </body>
</html>
