<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>simple-pid</title>
    <style>
      body {
        background-color: #18171f;
        margin: 0;
      }
      canvas {
        border: 1px solid #ffd54f;
        margin: 20px;
      }
    </style>
    <script src="../libs/dat.gui/dat.gui.min.js"></script>
  </head>
  <body>
    <canvas width="800" height="800" id="canvas"></canvas>
    
    <script type="module">
      import { PidChart } from './PidChart.js';

      const canvas = document.getElementById("canvas");
      const ctx = canvas.getContext("2d");
      const mouse = { x: 0, y: 0, event: null };
      
      const circle = {
        x: 20,
        y: canvas.height / 2,
        radius: 10,
        color: "#ffd54f",
        vx: 0,
      };
      const target = {
        x: canvas.width - 20,
      };

      // Запам'ятовуємо позицію кульки в момент останнього кліку для точного прогнозу
      let startXForPrediction = 20;

      const pidConfig = {
        Kp: 0.03,
        Ki: 0.003,
        Kd: 0.4,
        wind: -0.5
      };

      let integral = 0;
      let prevError = 0;

      const pidChart = new PidChart(ctx, 0, 0, canvas.width, canvas.height);

      function updatePrediction() {
        pidChart.predictTrajectory(
          pidConfig.Kp, 
          pidConfig.Ki, 
          pidConfig.Kd, 
          pidConfig.wind, 
          startXForPrediction, // Тепер тут фіксована координата, а не динамічний circle.x
          target.x
        );
      }

      const gui = new dat.GUI();
      gui.add(pidConfig, 'Kp', 0, 0.1, 0.001).onChange(updatePrediction);
      gui.add(pidConfig, 'Ki', 0, 0.01, 0.0001).onChange(updatePrediction);
      gui.add(pidConfig, 'Kd', 0, 1, 0.01).onChange(updatePrediction);
      gui.add(pidConfig, 'wind', -2, 2, 0.1).onChange(updatePrediction);

      updatePrediction();

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        const diff = target.x - circle.x;
        integral += diff; 
        integral = Math.max(-200, Math.min(200, integral));
        
        const pTerm = diff * pidConfig.Kp;
        const iTerm = integral * pidConfig.Ki;
        const dTerm = (diff - prevError) * pidConfig.Kd;
        
        const ax = pTerm + iTerm + dTerm;
        prevError = diff;
        circle.vx += ax + pidConfig.wind;
        circle.x += circle.vx;

        ctx.beginPath();
        ctx.fillStyle = circle.color;
        ctx.strokeStyle = circle.color;
        ctx.arc(circle.x, circle.y, circle.radius, 0, Math.PI * 2, 0);
        ctx.fill();

        ctx.beginPath();
        ctx.strokeStyle = circle.color;
        ctx.moveTo(target.x, 0);
        ctx.lineTo(target.x, canvas.height);
        ctx.stroke();

        ctx.save();
        ctx.beginPath();
        ctx.setLineDash([4, 6]);
        ctx.lineWidth = 1;
        ctx.strokeStyle = '#ffd54f';
        ctx.moveTo(mouse.x, 0);
        ctx.lineTo(mouse.x, canvas.height);
        ctx.stroke();
        ctx.restore();

        pidChart.draw();

        requestAnimationFrame(draw);
      }

      draw();

      canvas.addEventListener("mousemove", (event) => {
        const rect = canvas.getBoundingClientRect();
        mouse.x = event.clientX - rect.left;
        mouse.y = event.clientY - rect.top;
        mouse.event = event;
      });

      canvas.addEventListener("mousedown", (event) => {
        // У момент кліку фіксуємо, де зараз перебував м'ячик, щоб побудувати прогноз від цієї точки до нової цілі
        startXForPrediction = circle.x; 
        target.x = mouse.x;
        updatePrediction();
      });
    </script>
  </body>
</html>
