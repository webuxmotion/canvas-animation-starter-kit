<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <title>Локальний ШІ-Чат з Паузою</title>
    <style>
      body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 800px; margin: 40px auto; padding: 20px; background: #fafafa; color: #333; }
      .container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
      button { padding: 12px 24px; font-size: 15px; cursor: pointer; background: #0070f3; color: white; border: none; border-radius: 6px; font-weight: bold; transition: background 0.2s; }
      button:disabled { background: #eaeaea; color: #999; cursor: not-allowed; }
      #abort-btn { background: #ff3b30; display: none; } /* Кнопка зупинки спочатку схована */
      #status { color: #666; font-style: italic; margin: 15px 0; font-size: 14px; }
      #chat-box { background: #f5f5f7; padding: 20px; border-radius: 8px; min-height: 200px; max-height: 400px; overflow-y: auto; margin-bottom: 20px; border: 1px solid #e5e5ea; }
      .message { margin-bottom: 15px; padding: 10px 14px; border-radius: 8px; max-width: 80%; display: inline-block; clear: both; line-height: 1.5; }
      .user-msg { background: #0070f3; color: white; float: right; }
      .ai-msg { background: #e5e5ea; color: black; float: left; white-space: pre-wrap; }
      .input-area { display: flex; gap: 10px; }
      input { flex: 1; padding: 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; }
      input:disabled { background: #f0f0f0; }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>🤖 Локальний ШІ-Чат з можливістю зупинки</h1>
      <p>Ви можете перервати генерацію тексту в будь-який момент.</p>
      
      <button id="download-btn">1. Ініціалізувати ШІ-модель</button>
      <div id="status">Статус: Очікування запуску...</div>
      
      <div id="chat-box">
        <div class="message ai-msg">Привіт! Оберіть модель у коді та натисніть кнопку вище.</div>
      </div>
      
      <div class="input-area">
        <input type="text" id="user-input" placeholder="Введіть ваше запитання тут..." disabled />
        <button id="send-btn" disabled>Надіслати</button>
        <button id="abort-btn">Зупинити</button> <!-- Кнопка паузи/скасування -->
      </div>
    </div>
    
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
