<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vectors</title>
    <style>
      canvas {
        border: 1px solid;
      }
    </style>
  </head>
  <body>
    <canvas id="canvas" width="500" height="500"></canvas>
    <script src="../libs/dat.gui/dat.gui.min.js"></script>

    <script>
      const canvas = document.getElementById("canvas");
      const ctx = canvas.getContext("2d");

      const startA = {
        x: 50,
        y: 100,
      };

      const vectorA = {
        x: 150,
        y: 80,
      };

      const startB = {
        x: 300,
        y: 300,
      };

      const vectorB = {
        x: -80,
        y: -120,
      };

      const gui = new dat.GUI();

      const vectorAfolder = gui.addFolder("Vector A");
      vectorAfolder.add(startA, "x", 0, 500).name("startA.x").onChange(draw);
      vectorAfolder.add(startA, "y", 0, 500).name("startA.y").onChange(draw);
      vectorAfolder
        .add(vectorA, "x", -500, 500)
        .name("vectorA.x")
        .onChange(draw);
      vectorAfolder
        .add(vectorA, "y", -500, 500)
        .name("vectorA.y")
        .onChange(draw);
      vectorAfolder.open();

      const vectorBfolder = gui.addFolder("Vector B");
      vectorBfolder.add(startB, "x", 0, 500).name("startB.x").onChange(draw);
      vectorBfolder.add(startB, "y", 0, 500).name("startB.y").onChange(draw);
      vectorBfolder
        .add(vectorB, "x", -500, 500)
        .name("vectorB.x")
        .onChange(draw);
      vectorBfolder
        .add(vectorB, "y", -500, 500)
        .name("vectorB.y")
        .onChange(draw);
      vectorBfolder.open();

      draw();

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        ctx.beginPath();
        ctx.moveTo(startA.x, startA.y);
        ctx.lineTo(startA.x + vectorA.x, startA.y + vectorA.y);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(startB.x, startB.y);
        ctx.lineTo(startB.x + vectorB.x, startB.y + vectorB.y);
        ctx.stroke();
      }
    </script>
  </body>
</html>
