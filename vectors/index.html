<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vectors</title>
    <style>
      canvas {
        border: 1px solid;
      }
    </style>
  </head>
  <body>
    <canvas id="canvas" width="500" height="500"></canvas>
    <script src="../libs/dat.gui/dat.gui.min.js"></script>

    <script>
      const canvas = document.getElementById("canvas");
      const ctx = canvas.getContext("2d");

      const start = {
        x: 50,
        y: 100,
      };

      const vectorA = {
        x: 150,
        y: 80,
      };

      const vectorB = {
        x: 100,
        y: 200,
      };

      // multiplication
      const startM = {
        x: 200,
        y: 200,
      };

      const vectorM = {
        x: 50,
        y: 50,
      };

      window.multiplicator = 2;

      const gui = new dat.GUI();

      gui.add(window, "multiplicator", -2, 2, 1).onChange(draw);

      const startFolder = gui.addFolder("start");
      startFolder.add(start, "x", 0, 500).name("start.x").onChange(draw);
      startFolder.add(start, "y", 0, 500).name("start.y").onChange(draw);
      startFolder.open();

      const vectorAfolder = gui.addFolder("Vector A");
      vectorAfolder
        .add(vectorA, "x", -500, 500)
        .name("vectorA.x")
        .onChange(draw);
      vectorAfolder
        .add(vectorA, "y", -500, 500)
        .name("vectorA.y")
        .onChange(draw);
      vectorAfolder.open();

      const vectorBfolder = gui.addFolder("Vector B");
      vectorBfolder
        .add(vectorB, "x", -500, 500)
        .name("vectorB.x")
        .onChange(draw);
      vectorBfolder
        .add(vectorB, "y", -500, 500)
        .name("vectorB.y")
        .onChange(draw);
      vectorBfolder.open();

      draw();

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        const vectorMScaled = {
          x: vectorM.x * multiplicator,
          y: vectorM.y * multiplicator,
        };

        const length = Math.sqrt(vectorM.x ** 2 + vectorM.y ** 2);

        const direction = {
          x: vectorM.x / length,
          y: vectorM.y / length,
        };

        const endA = {
          x: start.x + vectorA.x,
          y: start.y + vectorA.y,
        };

        const endB = {
          x: start.x + vectorB.x,
          y: start.y + vectorB.y,
        };

        ctx.beginPath();
        ctx.moveTo(start.x, start.y);
        ctx.lineTo(endA.x, endA.y);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(start.x, start.y);
        ctx.lineTo(endB.x, endB.y);
        ctx.stroke();

        ctx.save();
        ctx.strokeStyle = "red";
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(endA.x, endA.y);
        ctx.lineTo(endB.x, endB.y);
        ctx.stroke();
        ctx.restore();

        // ctx.save();
        // ctx.strokeStyle = "green";
        // ctx.lineWidth = 4;
        // ctx.beginPath();
        // ctx.moveTo(startM.x, startM.y);
        // ctx.lineTo(startM.x + vectorMScaled.x, startM.y + vectorMScaled.y);
        // ctx.stroke();
        // ctx.restore();

        ctx.save();
        ctx.strokeStyle = "green";
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(startM.x, startM.y);
        ctx.lineTo(startM.x + direction.x * 10, startM.y + direction.y * 10);
        ctx.stroke();
        ctx.restore();
      }
    </script>
  </body>
</html>
